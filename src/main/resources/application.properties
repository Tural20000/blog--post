spring.application.name=blog-post
server.port=8086

# ==========================================
# PostgreSQL Database Configuration
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/blogdb
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# H2 Console (Disabled)
# ==========================================
spring.h2.console.enabled=false

# ==========================================
# Swagger & OpenAPI Config
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.index.html
springdoc.swagger-ui.enabled=true

# ==========================================
# Security & JWT Config
# ==========================================
jwt.secret=turalabdullayevsupersecretkeyforblogpostproject2026secure
jwt.expiration=86400000
spring.data.web.pageable.page-serialization-mode=via-dto

# ==========================================
# AI Service Config
# ==========================================
gemini.api.key=MY_KEY
gemini.api.url=https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=